<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📻</text></svg>">
<meta name="theme-color" content="#0a0a0a">
<title>TALKIE V2 — OPERATIVO</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --bg2: #111111;
    --bg3: #1a1a1a;
    --border: #2a2a2a;
    --accent: #00ff88;
    --accent2: #00cc6a;
    --warn: #ff6b00;
    --danger: #ff3333;
    --text: #e8e8e8;
    --text2: #888;
    --text3: #555;
    --channel-colors: #00ff88, #ff6b00, #4488ff, #ff3399, #ffcc00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { 
    height: 100%; 
    background: var(--bg); 
    color: var(--text); 
    font-family: 'Rajdhani', sans-serif;
    overflow: hidden;
    user-select: none;
  }
  
  /* SCREENS */
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; transition: opacity 0.3s, transform 0.3s; }
  .screen.hidden { opacity: 0; pointer-events: none; transform: translateY(20px); }

  /* LOGIN SCREEN */
  #login-screen {
    background: var(--bg);
    align-items: center;
    justify-content: center;
    padding: 2rem;
    gap: 2rem;
  }
  .logo-block { text-align: center; }
  .logo-signal {
    display: flex; align-items: flex-end; gap: 4px; justify-content: center;
    height: 48px; margin-bottom: 1rem;
  }
  .sig-bar {
    width: 8px;
    background: var(--accent);
    border-radius: 2px;
    animation: pulse-bar 1.4s ease-in-out infinite;
  }
  .sig-bar:nth-child(1) { height: 16px; animation-delay: 0s; }
  .sig-bar:nth-child(2) { height: 28px; animation-delay: 0.15s; }
  .sig-bar:nth-child(3) { height: 40px; animation-delay: 0.3s; }
  .sig-bar:nth-child(4) { height: 28px; animation-delay: 0.45s; }
  .sig-bar:nth-child(5) { height: 16px; animation-delay: 0.6s; }
  @keyframes pulse-bar {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  .logo-name { font-size: 3.5rem; font-weight: 700; letter-spacing: 0.3em; color: var(--accent); text-transform: uppercase; line-height: 1; }
  .logo-sub { font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; color: var(--text3); letter-spacing: 0.2em; margin-top: 0.3rem; }
  
  .form-group { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 1rem; }
  .input-wrap { position: relative; }
  .input-wrap label { font-size: 0.75rem; letter-spacing: 0.15em; color: var(--text3); text-transform: uppercase; display: block; margin-bottom: 0.4rem; }
  .field {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 1rem;
    padding: 0.75rem 1rem;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
  }
  .field:focus { border-color: var(--accent); }
  .field::placeholder { color: var(--text3); }
  
  .room-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .room-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text2);
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    padding: 0.6rem;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }
  .room-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,255,136,0.08); }
  
  .btn-join {
    width: 100%;
    background: var(--accent);
    border: none;
    color: #000;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    padding: 1rem;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
    margin-top: 0.5rem;
  }
  .btn-join:active { transform: scale(0.98); background: var(--accent2); }
  .btn-join:disabled { background: var(--border); color: var(--text3); cursor: not-allowed; }

  /* MAIN APP */
  #app-screen { background: var(--bg); }
  
  /* TOP BAR */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    flex-shrink: 0;
  }
  .topbar-left { display: flex; align-items: center; gap: 0.75rem; }
  .signal-icon { display: flex; align-items: flex-end; gap: 2px; height: 20px; }
  .sig-mini { width: 4px; background: var(--accent); border-radius: 1px; }
  .sig-mini:nth-child(1) { height: 6px; }
  .sig-mini:nth-child(2) { height: 11px; }
  .sig-mini:nth-child(3) { height: 16px; }
  .sig-mini:nth-child(4) { height: 20px; }
  .app-name { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.2em; color: var(--accent); }
  .user-badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    color: var(--text3);
    background: var(--bg3);
    padding: 0.2rem 0.5rem;
    border-radius: 3px;
    border: 1px solid var(--border);
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
  
  /* CHANNEL STRIP */
  .channel-strip {
    display: flex; gap: 0; overflow-x: auto; flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  .channel-strip::-webkit-scrollbar { display: none; }
  .ch-tab {
    flex-shrink: 0;
    padding: 0.6rem 1rem;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    white-space: nowrap;
    position: relative;
  }
  .ch-tab.active { color: var(--ch-color, var(--accent)); border-bottom-color: var(--ch-color, var(--accent)); }
  .ch-tab .ch-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ch-color, var(--accent)); display: inline-block; margin-right: 5px; vertical-align: middle; }
  .ch-tab .badge { position: absolute; top: 4px; right: 4px; background: var(--danger); color: #fff; font-size: 0.55rem; width: 14px; height: 14px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Share Tech Mono', monospace; }
  
  /* ACTIVITY LOG */
  .activity-area { flex: 1; overflow-y: auto; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.4rem; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .log-entry {
    display: flex; align-items: flex-start; gap: 0.5rem;
    padding: 0.5rem 0.75rem;
    border-radius: 4px;
    background: var(--bg3);
    border-left: 3px solid var(--ch-color, var(--border));
    animation: slide-in 0.2s ease;
  }
  @keyframes slide-in { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
  .log-entry.system { background: transparent; border-left-color: var(--text3); }
  .log-entry.transmitting { background: rgba(0,255,136,0.05); border-left-color: var(--accent); }
  .log-meta { flex-shrink: 0; }
  .log-user { font-size: 0.8rem; font-weight: 700; color: var(--ch-color, var(--text)); }
  .log-time { font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; color: var(--text3); }
  .log-content { font-size: 0.85rem; color: var(--text2); line-height: 1.4; display: flex; align-items: center; gap: 6px; }
  .wave-anim { display: flex; align-items: center; gap: 2px; height: 14px; }
  .wave-bar { width: 3px; height: 6px; background: var(--accent); border-radius: 1px; animation: wave 0.5s ease-in-out infinite; }
  .wave-bar:nth-child(2) { animation-delay: 0.1s; }
  .wave-bar:nth-child(3) { animation-delay: 0.2s; }
  .wave-bar:nth-child(4) { animation-delay: 0.3s; }
  .wave-bar:nth-child(5) { animation-delay: 0.4s; }
  @keyframes wave { 0%,100%{height:4px} 50%{height:12px} }

  /* USERS PANEL */
  .users-bar {
    border-top: 1px solid var(--border);
    padding: 0.5rem 0.75rem;
    display: flex; gap: 0.4rem; align-items: center; overflow-x: auto; flex-shrink: 0;
    scrollbar-width: none;
  }
  .users-bar::-webkit-scrollbar { display: none; }
  .users-label { font-size: 0.65rem; letter-spacing: 0.1em; color: var(--text3); text-transform: uppercase; flex-shrink: 0; margin-right: 0.25rem; }
  .user-pill {
    display: flex; align-items: center; gap: 4px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.2rem 0.6rem;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text2);
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .user-pill .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text3); }
  .user-pill.online .dot { background: var(--accent); box-shadow: 0 0 4px var(--accent); }
  .user-pill.speaking { border-color: var(--accent); color: var(--accent); background: rgba(0,255,136,0.08); }
  .user-pill.speaking .dot { animation: pulse-dot 0.5s ease-in-out infinite; }
  @keyframes pulse-dot { 0%,100%{transform:scale(1)} 50%{transform:scale(1.8)} }

  /* PTT ZONE */
  .ptt-zone {
    padding: 1rem 1.25rem 1.5rem;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .ptt-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
  .ptt-channel { font-size: 0.75rem; letter-spacing: 0.1em; color: var(--text3); text-transform: uppercase; }
  .ptt-channel span { color: var(--ch-color, var(--accent)); font-weight: 700; }
  .ptt-timer { font-family: 'Share Tech Mono', monospace; font-size: 0.8rem; color: var(--text3); }
  
  .ptt-btn {
    width: 100%;
    height: 80px;
    background: var(--bg3);
    border: 2px solid var(--border);
    border-radius: 8px;
    color: var(--text2);
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.1s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    position: relative;
    overflow: hidden;
    outline: none;
    -webkit-touch-callout: none;
  }
  .ptt-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--ch-color, var(--accent));
    opacity: 0;
    transition: opacity 0.1s;
  }
  .ptt-btn.active::before { opacity: 0.12; }
  .ptt-btn.active {
    border-color: var(--ch-color, var(--accent));
    color: var(--ch-color, var(--accent));
    box-shadow: 0 0 20px rgba(0,255,136,0.2), inset 0 0 20px rgba(0,255,136,0.05);
  }
  .ptt-btn .ptt-icon {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid currentColor;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    position: relative; z-index: 1;
  }
  .ptt-btn .ptt-text { position: relative; z-index: 1; }
  
  .ptt-ripple {
    position: absolute;
    width: 100%; height: 100%;
    border: 2px solid var(--ch-color, var(--accent));
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
  }
  .ptt-btn.active .ptt-ripple { animation: ripple-out 1s ease-out infinite; }
  @keyframes ripple-out { 0%{opacity:0.5;transform:scale(1)} 100%{opacity:0;transform:scale(1.05)} }

  /* NOISE METER */
  .noise-meter { display: flex; gap: 2px; align-items: flex-end; height: 20px; margin-top: 0.5rem; }
  .noise-bar { flex: 1; background: var(--border); border-radius: 1px; transition: height 0.05s, background 0.1s; min-height: 2px; }
  .noise-bar.active { background: var(--ch-color, var(--accent)); }

  /* MUTE / SETTINGS ROW */
  .controls-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  .ctrl-btn {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text2);
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 0.5rem;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .ctrl-btn.active { border-color: var(--danger); color: var(--danger); }
  .ctrl-btn svg { width: 14px; height: 14px; }

  /* VOLUME VIZ */
  .volume-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 2px solid var(--ch-color, var(--accent));
    opacity: 0;
    transition: opacity 0.1s;
  }

  /* TOAST */
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 0.85rem;
    padding: 0.6rem 1.2rem;
    border-radius: 4px;
    font-family: 'Share Tech Mono', monospace;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  
  /* SCANNING OVERLAY when transmitting */
  .scan-line {
    position: absolute; top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--ch-color, var(--accent)), transparent);
    opacity: 0;
    pointer-events: none;
  }
  .ptt-btn.active .scan-line { animation: scan 1.5s linear infinite; opacity: 0.7; }
  @keyframes scan { 0%{top:0} 100%{top:100%} }

  /* PERMISSION OVERLAY */
  .perm-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 2rem;
  }
  .perm-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2rem;
    max-width: 300px;
    text-align: center;
  }
  .perm-card h3 { font-size: 1.2rem; color: var(--accent); margin-bottom: 0.75rem; letter-spacing: 0.1em; }
  .perm-card p { font-size: 0.85rem; color: var(--text2); margin-bottom: 1.5rem; line-height: 1.5; }
  .perm-card button { width: 100%; background: var(--accent); border: none; color: #000; font-family: 'Rajdhani', sans-serif; font-size: 1rem; font-weight: 700; padding: 0.8rem; border-radius: 4px; cursor: pointer; letter-spacing: 0.1em; }
  
  /* SCROLLBAR */
  .activity-area::-webkit-scrollbar { width: 4px; }
  .activity-area::-webkit-scrollbar-track { background: transparent; }
  .activity-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* LATENCY indicator */
  .latency { font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; color: var(--text3); }
  .latency.good { color: var(--accent); }
  .latency.warn { color: var(--warn); }

  @media (max-height: 600px) {
    .ptt-btn { height: 60px; }
    .activity-area { flex: 0.6; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="screen" id="login-screen">
  <div class="logo-block">
    <div class="logo-signal">
      <div class="sig-bar"></div><div class="sig-bar"></div>
      <div class="sig-bar"></div><div class="sig-bar"></div>
      <div class="sig-bar"></div>
    </div>
    <div class="logo-name">TALKIE</div>
    <div class="logo-sub">EVENT RADIO SYSTEM v1.0</div>
  </div>

  <div class="form-group">
    <div class="input-wrap">
      <label>Tu nombre / callsign</label>
      <input class="field" id="username" type="text" placeholder="STAFF-01" maxlength="16" autocomplete="off" spellcheck="false">
    </div>
    <div class="input-wrap">
      <label>Código de evento</label>
      <input class="field" id="eventcode" type="text" placeholder="EVENTO-2025" maxlength="20" autocomplete="off" spellcheck="false">
    </div>
    <div class="input-wrap">
      <label>Canal inicial</label>
      <div class="room-grid" id="channel-select">
        <button class="room-btn active" data-ch="GENERAL" style="--ch-color:#00ff88">● GENERAL</button>
        <button class="room-btn" data-ch="STAFF" style="--ch-color:#ff6b00">● STAFF</button>
        <button class="room-btn" data-ch="SEGURIDAD" style="--ch-color:#4488ff">● SEGURIDAD</button>
        <button class="room-btn" data-ch="PRODUCCION" style="--ch-color:#ff3399">● PRODUCCIÓN</button>
      </div>
    </div>
    <button class="btn-join" id="btn-join" onclick="joinEvent()">▶ CONECTAR</button>
  </div>
</div>

<!-- MAIN APP -->
<div class="screen hidden" id="app-screen">
  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="signal-icon" id="sig-icon">
        <div class="sig-mini"></div><div class="sig-mini"></div>
        <div class="sig-mini"></div><div class="sig-mini"></div>
      </div>
      <span class="app-name">TALKIE</span>
      <span class="latency good" id="latency">12ms</span>
    </div>
    <div style="display:flex;align-items:center;gap:0.5rem">
      <span class="user-badge" id="topbar-user">—</span>
      <div class="status-dot" id="conn-dot"></div>
    </div>
  </div>

  <!-- CHANNELS -->
  <div class="channel-strip" id="channel-strip"></div>

  <!-- ACTIVITY LOG -->
  <div class="activity-area" id="activity-log">
    <div class="log-entry system" style="--ch-color:#555">
      <div class="log-meta">
        <div class="log-user" style="color:var(--text3)">SISTEMA</div>
        <div class="log-time" id="connect-time">--:--</div>
      </div>
      <div class="log-content">Inicializando sistema de radio...</div>
    </div>
  </div>

  <!-- ONLINE USERS -->
  <div class="users-bar" id="users-bar">
    <span class="users-label">ONLINE</span>
  </div>

  <!-- PTT ZONE -->
  <div class="ptt-zone">
    <div class="ptt-info">
      <div class="ptt-channel">Canal: <span id="active-ch-label">—</span></div>
      <div class="ptt-timer" id="tx-timer">00:00</div>
    </div>
    
    <button class="ptt-btn" id="ptt-btn"
      ontouchstart="startPTT(event)" ontouchend="stopPTT(event)"
      onmousedown="startPTT(event)" onmouseup="stopPTT(event)" onmouseleave="stopPTT(event)">
      <div class="scan-line"></div>
      <div class="ptt-ripple"></div>
      <div class="ptt-icon" id="ptt-icon">🎙</div>
      <span class="ptt-text" id="ptt-label">PULSA PARA HABLAR</span>
    </button>

    <div class="noise-meter" id="noise-meter">
      <!-- bars injected by JS -->
    </div>

    <div class="controls-row">
      <button class="ctrl-btn" id="mute-btn" onclick="toggleMute()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        MICRÓFONO
      </button>
      <button class="ctrl-btn" id="sound-btn" onclick="toggleSound()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        SONIDO
      </button>
      <button class="ctrl-btn" onclick="leaveEvent()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        SALIR
      </button>
    </div>
  </div>
</div>

<!-- PERMISSION OVERLAY -->
<div class="perm-overlay hidden" id="perm-overlay">
  <div class="perm-card">
    <h3>🎙 ACCESO AL MICRÓFONO</h3>
    <p>Para usar TALKIE necesitas permitir acceso al micrófono de tu dispositivo.</p>
    <button onclick="requestMic()">PERMITIR ACCESO</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- AUDIO CONTEXT NODES (hidden) -->
<div style="display:none">
  <audio id="remote-audio" autoplay></audio>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ============================================================
// TALKIE — Event Radio System
// WebRTC + WebSocket Push-to-Talk
// ============================================================

const CHANNELS = [
  { id: 'GENERAL',    label: 'GENERAL',    color: '#00ff88' },
  { id: 'STAFF',      label: 'STAFF',      color: '#ff6b00' },
  { id: 'SEGURIDAD',  label: 'SEGURIDAD',  color: '#4488ff' },
  { id: 'PRODUCCION', label: 'PRODUCCIÓN', color: '#ff3399' },
  { id: 'EMERGENCIA', label: '⚠ EMERGENCIA', color: '#ff3333' },
];

let state = {
  user: '',
  event: '',
  channel: 'GENERAL',
  muted: false,
  soundOn: true,
  transmitting: false,
  connected: false,
  txStart: null,
  txInterval: null,
  stream: null,
  audioCtx: null,
  analyser: null,
  peers: {},       // peerId -> RTCPeerConnection
  ws: null,
  users: {},       // { id, name, channel, speaking }
  myId: null,
  msgCount: {},
};

// ──────────────────────────────────────────
// UI HELPERS
// ──────────────────────────────────────────

function showToast(msg, ms = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

function now() {
  return new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function getChannel(id) {
  return CHANNELS.find(c => c.id === id) || CHANNELS[0];
}

function buildChannelStrip() {
  const strip = document.getElementById('channel-strip');
  strip.innerHTML = '';
  CHANNELS.forEach(ch => {
    const t = document.createElement('button');
    t.className = 'ch-tab' + (ch.id === state.channel ? ' active' : '');
    t.style.setProperty('--ch-color', ch.color);
    t.innerHTML = `<span class="ch-dot"></span>${ch.label}`;
    if (state.msgCount[ch.id] > 0 && ch.id !== state.channel) {
      t.innerHTML += `<span class="badge">${state.msgCount[ch.id]}</span>`;
    }
    t.onclick = () => switchChannel(ch.id);
    strip.appendChild(t);
  });
}

function updateChannelColor() {
  const ch = getChannel(state.channel);
  document.documentElement.style.setProperty('--ch-color', ch.color);
  document.getElementById('active-ch-label').textContent = ch.label;
}

function buildNoiseMeter() {
  const m = document.getElementById('noise-meter');
  m.innerHTML = '';
  for (let i = 0; i < 24; i++) {
    const b = document.createElement('div');
    b.className = 'noise-bar';
    b.id = `nb${i}`;
    m.appendChild(b);
  }
}

function addLogEntry(user, content, chId = state.channel, type = '') {
  const ch = getChannel(chId);
  const log = document.getElementById('activity-log');
  const e = document.createElement('div');
  e.className = `log-entry ${type}`;
  e.style.setProperty('--ch-color', ch.color);
  e.innerHTML = `
    <div class="log-meta">
      <div class="log-user" style="color:${ch.color}">${user}</div>
      <div class="log-time">${now()}</div>
    </div>
    <div class="log-content">${content}</div>
  `;
  log.appendChild(e);
  log.scrollTop = log.scrollHeight;
  // Badge if not current channel
  if (chId !== state.channel && type !== 'system') {
    state.msgCount[chId] = (state.msgCount[chId] || 0) + 1;
    buildChannelStrip();
  }
}

function renderUsers() {
  const bar = document.getElementById('users-bar');
  bar.innerHTML = '<span class="users-label">ONLINE</span>';
  Object.values(state.users).forEach(u => {
    const p = document.createElement('div');
    p.className = `user-pill online ${u.speaking ? 'speaking' : ''}`;
    p.innerHTML = `<span class="dot"></span>${u.name}`;
    bar.appendChild(p);
  });
}

// ──────────────────────────────────────────
// CHANNEL SELECT ON LOGIN
// ──────────────────────────────────────────

document.getElementById('channel-select').addEventListener('click', e => {
  const btn = e.target.closest('.room-btn');
  if (!btn) return;
  document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.channel = btn.dataset.ch;
});

document.getElementById('username').addEventListener('input', validateForm);
document.getElementById('eventcode').addEventListener('input', validateForm);

function validateForm() {
  const u = document.getElementById('username').value.trim();
  const e = document.getElementById('eventcode').value.trim();
  document.getElementById('btn-join').disabled = !(u.length >= 2 && e.length >= 2);
}

// Auto-uppercase callsign
document.getElementById('username').addEventListener('keyup', function() {
  this.value = this.value.toUpperCase();
});
document.getElementById('eventcode').addEventListener('keyup', function() {
  this.value = this.value.toUpperCase();
});

validateForm();

// ──────────────────────────────────────────
// JOIN / LEAVE
// ──────────────────────────────────────────

async function joinEvent() {
  const u = document.getElementById('username').value.trim().toUpperCase();
  const e = document.getElementById('eventcode').value.trim().toUpperCase();
  if (!u || !e) return;
  
  state.user = u;
  state.event = e;

  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-screen').classList.remove('hidden');
  document.getElementById('topbar-user').textContent = u;

  buildNoiseMeter();
  buildChannelStrip();
  updateChannelColor();
  CHANNELS.forEach(c => state.msgCount[c.id] = 0);
  document.getElementById('connect-time').textContent = now();

  // 1. CONECTAR PRIMERO (Independiente del micro)
  initRealCommunication({ name: u, event: e, channel: state.channel });
  state.connected = true;
  startLatencyFake();
  addLogEntry('SISTEMA', `Conectando al evento <b>${e}</b>...`, 'GENERAL', 'system');

  // 2. PEDIR MICRO DESPUES
  try {
    await setupAudio();
    addLogEntry('SISTEMA', '✓ Radio lista para transmitir', 'GENERAL', 'system');
  } catch (err) {
    remoteLog('ERROR', 'Fallo inicial de microfono: ' + err.message);
    document.getElementById('perm-overlay').classList.remove('hidden');
  }
}

function leaveEvent() {
  if (state.stream) state.stream.getTracks().forEach(t => t.stop());
  if (state.audioCtx) state.audioCtx.close();
  if (state.ws) state.ws.disconnect();
  clearInterval(state.txInterval);
  state = { ...state, stream: null, audioCtx: null, connected: false, transmitting: false, users: {}, peers: {}, ws: null };
  document.getElementById('app-screen').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('activity-log').innerHTML = `
    <div class="log-entry system" style="--ch-color:#555">
      <div class="log-meta"><div class="log-user" style="color:var(--text3)">SISTEMA</div><div class="log-time" id="connect-time">--:--</div></div>
      <div class="log-content">Inicializando sistema de radio...</div>
    </div>`;
}

function remoteLog(type, message) {
  console.log(`[${type}] ${message}`);
  if (state.ws) {
    state.ws.emit('client_log', { type, message });
  }
}

async function requestMic() {
  try {
    await setupAudio();
    const overlay = document.getElementById('perm-overlay');
    overlay.classList.add('hidden');
    overlay.style.display = 'none'; // Forzar ocultacion
    
    addLogEntry('SISTEMA', 'Micrófono activado correctamente ✓', state.channel, 'system');
    remoteLog('DEBUG', 'Microfono activado y overlay cerrado');
  } catch(e) {
    alert('ERROR DE MICROFONO: ' + e.message);
    remoteLog('ERROR', 'Fallo en requestMic: ' + e.message);
    showToast('⚠ Error: ' + e.message);
  }
}

// ──────────────────────────────────────────
// AUDIO SETUP
// ──────────────────────────────────────────

async function setupAudio() {
  console.log('[DEBUG] Intentando obtener mediaDevices.getUserMedia...');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    console.error('[DEBUG] El navegador no soporta getUserMedia o no esta en un entorno seguro (HTTPS/Localhost)');
    throw new Error('Navegador no compatible');
  }
  
  state.stream = await navigator.mediaDevices.getUserMedia({
    audio: {
      echoCancellation: true,
      noiseSuppression: true,
      sampleRate: 16000,
      channelCount: 1,
    }
  });
  console.log('[DEBUG] Stream de audio obtenido:', state.stream);
  
  state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  console.log('[DEBUG] AudioContext creado');
  
  const source = state.audioCtx.createMediaStreamSource(state.stream);
  state.analyser = state.audioCtx.createAnalyser();
  state.analyser.fftSize = 64;
  source.connect(state.analyser);
  
  state.stream.getAudioTracks().forEach(t => {
    t.enabled = false;
    console.log('[DEBUG] Track de audio silenciado por defecto:', t.label);
  });
  
  startMeterLoop();
}

function startMeterLoop() {
  const buf = new Uint8Array(state.analyser.frequencyBinCount);
  const bars = document.querySelectorAll('.noise-bar');
  function loop() {
    if (!state.analyser) return;
    state.analyser.getByteFrequencyData(buf);
    bars.forEach((b, i) => {
      const val = buf[Math.floor(i * buf.length / bars.length)] || 0;
      const h = Math.max(2, Math.round((val / 255) * 20));
      b.style.height = h + 'px';
      b.classList.toggle('active', state.transmitting && val > 20);
    });
    requestAnimationFrame(loop);
  }
  loop();
}

// ──────────────────────────────────────────
// PTT (PUSH TO TALK)
// ──────────────────────────────────────────

function startPTT(e) {
  e.preventDefault();
  if (state.muted || !state.stream) { showToast('🔇 Micrófono silenciado'); return; }
  if (state.transmitting) return;
  state.transmitting = true;
  state.txStart = Date.now();

  const btn = document.getElementById('ptt-btn');
  btn.classList.add('active');
  document.getElementById('ptt-label').textContent = '📡 TRANSMITIENDO...';
  document.getElementById('ptt-icon').textContent = '📡';

  // Enable mic track
  if (state.stream) state.stream.getAudioTracks().forEach(t => t.enabled = true);

  // Timer
  state.txInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - state.txStart) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    document.getElementById('tx-timer').textContent = `${m}:${s}`;
  }, 500);

  // Log
  addLogEntry(state.user, `<div class="wave-anim"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div> transmitiendo`, state.channel, 'transmitting');

  // Send to simulated peers (in real version: send via WebRTC data channel / signal)
  broadcastPTTStart();
  navigator.vibrate && navigator.vibrate(30);
}

function stopPTT(e) {
  if (e) e.preventDefault();
  if (!state.transmitting) return;
  state.transmitting = false;

  const btn = document.getElementById('ptt-btn');
  btn.classList.remove('active');
  document.getElementById('ptt-label').textContent = 'PULSA PARA HABLAR';
  document.getElementById('ptt-icon').textContent = '🎙';

  // Disable mic track
  if (state.stream) state.stream.getAudioTracks().forEach(t => t.enabled = false);

  clearInterval(state.txInterval);
  const elapsed = Math.floor((Date.now() - state.txStart) / 1000);
  document.getElementById('tx-timer').textContent = `00:00`;

  addLogEntry(state.user, `✓ Transmisión ${elapsed}s`, state.channel, 'system');
  broadcastPTTStop();
  navigator.vibrate && navigator.vibrate([20, 10, 20]);
}

// ──────────────────────────────────────────
// CHANNEL SWITCH
// ──────────────────────────────────────────

function switchChannel(chId) {
  if (state.transmitting) stopPTT(null);
  state.channel = chId;
  state.msgCount[chId] = 0;
  buildChannelStrip();
  updateChannelColor();
  addLogEntry('SISTEMA', `Cambiado a canal ${getChannel(chId).label}`, chId, 'system');
}

// ──────────────────────────────────────────
// MUTE / SOUND CONTROLS
// ──────────────────────────────────────────

function toggleMute() {
  state.muted = !state.muted;
  const btn = document.getElementById('mute-btn');
  btn.classList.toggle('active', state.muted);
  btn.querySelector('svg').style.opacity = state.muted ? '0.5' : '1';
  showToast(state.muted ? '🔇 Micrófono silenciado' : '🎙 Micrófono activo');
  if (state.transmitting && state.muted) stopPTT(null);
}

function toggleSound() {
  state.soundOn = !state.soundOn;
  const btn = document.getElementById('sound-btn');
  btn.classList.toggle('active', !state.soundOn);
  showToast(state.soundOn ? '🔊 Sonido activado' : '🔈 Sonido silenciado');
}

// ──────────────────────────────────────────
// SIMULATED MULTI-USER (demo mode)
// In production: replace with real WebSocket + WebRTC
// ──────────────────────────────────────────

const DEMO_USERS = [
  { name: 'SEGUR-01', channel: 'SEGURIDAD' },
  { name: 'PROD-02',  channel: 'PRODUCCION' },
  { name: 'STAFF-04', channel: 'GENERAL' },
  { name: 'STAFF-07', channel: 'GENERAL' },
  { name: 'EMERG-01', channel: 'EMERGENCIA' },
];

const DEMO_MSGS = [
  ['STAFF-04', 'Todo despejado por la entrada norte, copy.', 'GENERAL'],
  ['PROD-02',  'Necesito un técnico en el escenario B, over.', 'PRODUCCION'],
  ['SEGUR-01', 'Perímetro asegurado, sin incidencias.', 'SEGURIDAD'],
  ['STAFF-07', 'Confirmado, voy para allá. ETA 3 minutos.', 'GENERAL'],
  ['PROD-02',  'Atención todos: soundcheck en 10 minutos.', 'PRODUCCION'],
  ['SEGUR-01', 'Sector 4 revisado. Todo en orden.', 'SEGURIDAD'],
  ['STAFF-04', 'Recibido. Canal STAFF libre ahora.', 'STAFF'],
  ['EMERG-01', '🚑 Sanitarios en posición, todo OK.', 'EMERGENCIA'],
];

function simulateUsers() {
  DEMO_USERS.forEach((u, i) => {
    setTimeout(() => {
      state.users[u.name] = { ...u, speaking: false };
      renderUsers();
      addLogEntry('SISTEMA', `${u.name} se ha conectado`, u.channel, 'system');
    }, (i + 1) * 800);
  });
}

function simulateIncoming() {
  let idx = 0;
  function next() {
    if (!state.connected) return;
    const msg = DEMO_MSGS[idx % DEMO_MSGS.length];
    const [user, text, ch] = msg;
    const delay = 3000 + Math.random() * 8000;
    setTimeout(() => {
      if (!state.connected) return;
      // Mark speaking
      if (state.users[user]) {
        state.users[user].speaking = true;
        renderUsers();
      }
      addLogEntry(user, `<div class="wave-anim"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div> ${text}`, ch);
      playBeep('rx');
      setTimeout(() => {
        if (state.users[user]) {
          state.users[user].speaking = false;
          renderUsers();
        }
      }, 2000 + Math.random() * 2000);
      idx++;
      next();
    }, delay);
  }
  next();
}

// ──────────────────────────────────────────
// LATENCY FAKE (replace with real RTT measurement)
// ──────────────────────────────────────────

function startLatencyFake() {
  setInterval(() => {
    const ms = 8 + Math.floor(Math.random() * 40);
    const el = document.getElementById('latency');
    if (el) {
      el.textContent = `${ms}ms`;
      el.className = 'latency ' + (ms < 30 ? 'good' : 'warn');
    }
  }, 3000);
}

// ──────────────────────────────────────────
// WEBRTC & SOCKET.IO (Real Implementation)
// ──────────────────────────────────────────

const ICE_CONFIG = {
  iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
};

function initRealCommunication(userData) {
  if (state.ws) return; 
  
  state.ws = io();

  state.ws.on('connect', () => {
    state.myId = state.ws.id;
    // Usamos los datos pasados por parámetro para asegurar que NO estén vacíos
    state.ws.emit('join', {
      name: userData.name,
      event: userData.event,
      channel: userData.channel
    });
    remoteLog('DEBUG', `Conectado como ${userData.name} al evento ${userData.event}`);
  });

  state.ws.on('room_users', (users) => {
    state.users = {};
    users.forEach(u => {
      if (u.id !== state.myId) state.users[u.id] = u;
    });
    renderUsers();
  });

  state.ws.on('user_joined', (user) => {
    state.users[user.id] = user;
    renderUsers();
    addLogEntry('SISTEMA', `${user.name} se ha conectado`, user.channel, 'system');
  });

  state.ws.on('user_left', ({ id }) => {
    if (state.users[id]) {
      addLogEntry('SISTEMA', `${state.users[id].name} se ha desconectado`, state.users[id].channel, 'system');
      delete state.users[id];
      if (state.peers[id]) {
        state.peers[id].close();
        delete state.peers[id];
      }
      renderUsers();
    }
  });

  state.ws.on('user_channel_changed', ({ id, channel }) => {
    if (state.users[id]) {
      state.users[id].channel = channel;
      renderUsers();
    }
  });

  state.ws.on('existing_peers', (peerIds) => {
    peerIds.forEach(peerId => createPeerConnection(peerId, true));
  });

  state.ws.on('offer', async ({ fromId, sdp }) => {
    const pc = createPeerConnection(fromId, false);
    await pc.setRemoteDescription(new RTCSessionDescription(sdp));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    state.ws.emit('answer', { targetId: fromId, sdp: answer });
  });

  state.ws.on('answer', async ({ fromId, sdp }) => {
    const pc = state.peers[fromId];
    if (pc) {
      await pc.setRemoteDescription(new RTCSessionDescription(sdp));
    }
  });

  state.ws.on('ice_candidate', async ({ fromId, candidate }) => {
    const pc = state.peers[fromId];
    if (pc) {
      await pc.addIceCandidate(new RTCIceCandidate(candidate));
    }
  });

  state.ws.on('ptt_start', ({ id, name, channel }) => {
    if (state.users[id]) {
      state.users[id].speaking = true;
      renderUsers();
    }
    if (channel === state.channel) {
      addLogEntry(name || 'USUARIO', `<div class="wave-anim"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div> transmitiendo`, channel, 'transmitting');
      playBeep('rx');
    }
  });

  state.ws.on('ptt_stop', ({ id, name, channel }) => {
    if (state.users[id]) {
      state.users[id].speaking = false;
      renderUsers();
    }
  });
}

function createPeerConnection(peerId, isOffer) {
  if (state.peers[peerId]) return state.peers[peerId];

  const pc = new RTCPeerConnection(ICE_CONFIG);
  state.peers[peerId] = pc;

  // Add our tracks
  if (state.stream) {
    state.stream.getTracks().forEach(track => pc.addTrack(track, state.stream));
  }

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      state.ws.emit('ice_candidate', { targetId: peerId, candidate: event.candidate });
    }
  };

  pc.ontrack = (event) => {
    const remoteAudio = document.getElementById('remote-audio');
    if (remoteAudio.srcObject !== event.streams[0]) {
      remoteAudio.srcObject = event.streams[0];
    }
  };

  if (isOffer) {
    pc.onnegotiationneeded = async () => {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      state.ws.emit('offer', { targetId: peerId, sdp: offer });
    };
  }

  return pc;
}

function broadcastPTTStart() {
  if (state.ws) {
    state.ws.emit('ptt_start', { channel: state.channel });
  }
  playBeep('tx');
}

function broadcastPTTStop() {
  if (state.ws) {
    state.ws.emit('ptt_stop', { channel: state.channel });
  }
  playBeep('tx_end');
}

function switchChannel(chId) {
  if (state.transmitting) stopPTT(null);
  state.channel = chId;
  state.msgCount[chId] = 0;
  buildChannelStrip();
  updateChannelColor();
  
  if (state.ws) {
    state.ws.emit('change_channel', { channel: chId });
  }
  
  addLogEntry('SISTEMA', `Cambiado a canal ${getChannel(chId).label}`, chId, 'system');
}

// ──────────────────────────────────────────
// KEYBOARD SHORTCUT: SPACE = PTT
// ──────────────────────────────────────────

let spaceDown = false;
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !spaceDown && state.connected) {
    e.preventDefault();
    spaceDown = true;
    startPTT(e);
  }
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space') {
    spaceDown = false;
    stopPTT(e);
  }
});

// Prevent scroll on space
window.addEventListener('keydown', e => { if (e.code === 'Space') e.preventDefault(); });

// ──────────────────────────────────────────
// PREVENT SLEEP on mobile (Wake Lock API)
// ──────────────────────────────────────────

async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try {
      await navigator.wakeLock.request('screen');
    } catch(e) {}
  }
}
requestWakeLock();

// ──────────────────────────────────────────
// INIT
// ──────────────────────────────────────────

document.getElementById('username').focus();
</script>
